<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click Me</title>
</head>
<body>
  <button id="myBtn">Click me</button>

  <script>
    const btn = document.getElementById("myBtn");

    btn.addEventListener("click", function () {
      console.log("Hello World");
    });
  </script>
</body>
</html>
