<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sum Even Numbers</title>
</head>
<body>
  <button id="myBtn">Click me</button>

  <script>
    const btn = document.getElementById("myBtn");

    btn.addEventListener("click", function () {
      const numbers = [];
      for (let i = 0; i <= 100; i++) {
        numbers.push(i);
      }

      let sum = 0;
      for (let i = 0; i < numbers.length; i++) {
        if (numbers[i] % 2 === 0) {
          sum += numbers[i];
        }
      }

      console.log("Sum of even numbers:", sum);
    });
  </script>
</body>
</html>
