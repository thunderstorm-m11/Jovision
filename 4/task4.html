<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sum Array</title>
</head>
<body>
  <button id="myBtn">Click me</button>

  <script>
    const btn = document.getElementById("myBtn");

    btn.addEventListener("click", function () {
      // Create an array of numbers from 0 to 100
      const numbers = [];
      for (let i = 0; i <= 100; i++) {
        numbers.push(i);
      }

      // Loop through the array and add up the numbers
      let sum = 0;
      for (let i = 0; i < numbers.length; i++) {
        sum += numbers[i];
      }

      console.log("Sum:", sum);
    });
  </script>
</body>
</html>
